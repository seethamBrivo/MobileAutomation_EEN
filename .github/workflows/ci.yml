name: CI

on:
  # A pull request runs only the tests it affects (scripts/select-tests.sh), on Android and iOS. This check is
  # advisory: do NOT add it to the branch protection "required checks", so a red run never blocks the merge.
  # Nothing runs on a merge to main; use the manual trigger below for a full run.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # Full regression (Android, then iOS) before the day starts: 05:00 IST = 23:30 UTC the evening before, so Sunday to
  # Thursday UTC covers Monday to Friday in India. GitHub cron is UTC, runs only on the default branch, and a busy
  # runner can start it a few minutes late.
  schedule:
    - cron: '30 23 * * 0-4'
  workflow_dispatch:  # Allows manual trigger from GitHub UI
    inputs:
      platform:
        description: 'platform for a manual run: android (default) or ios (needs the IOS_BROWSERSTACK_APP_URL secret). A merge to main runs both, Android first, then iOS'
        type: choice
        options: [android, ios]
        default: android
      suite_file:
        description: 'TestNG suite to run. Leave empty for the platform default: android = testng-parallel.xml (2 parallel workers, then BridgesTest alone), ios = testng-ios.xml. Others: testng.xml = all Android tests serially; testng-diagnostics.xml dumps UI hierarchies'
        type: string
        default: ''
      use_sdk:
        description: 'Run through the BrowserStack SDK (browserstack.yml) instead of direct capabilities'
        type: boolean
        default: false
      session_scope:
        description: 'class = one Appium session and login per test class (faster); method = fresh session and login per test'
        type: choice
        options: [class, method]
        default: class
      diagnostics:
        description: 'BrowserStack debug logs, network logs and video (slower sessions). Always on for a merge to main; untick to speed up a manual run. Network logs are never used on iOS: they stop the camera video from loading'
        type: boolean
        default: true

# The suite uses 2 BrowserStack sessions and shared test accounts/bridges, so two CI runs must never overlap.
# A later push waits for the running one instead of cancelling it half-way through its tests.
concurrency:
  group: browserstack-device-tests
  cancel-in-progress: false

jobs:
  build:
    # A merge to main runs the Android suite first and then the iOS suite (max-parallel 1: the BrowserStack plan has
    # 2 parallel sessions, and each suite uses both of them for its own parallel workers). Both always run: an Android
    # failure does not skip iOS. A manual run does only the platform chosen in the form.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["android","ios"]' || format('["{0}"]', inputs.platform)) }}
    name: ${{ matrix.platform }} tests
    # No secrets reach a fork's PR, and a draft is not ready for device time.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Reject the BrowserStack SDK on iOS
        # browserstack.yml describes an Android device matrix, so the SDK path would start the wrong device for iOS.
        if: matrix.platform == 'ios' && inputs.use_sdk == true
        run: |
          echo "::error::use_sdk is Android only. Run iOS without it (direct capabilities)."
          exit 1

      - name: Check the iOS app secret
        # First step of the job, so it fails within seconds with a clear message, not an obscure BrowserStack error,
        # when the secret is missing, has extra lines or is not a bs:// id (the uploaded IPA expires after about
        # 30 days; upload it again).
        if: matrix.platform == 'ios'
        env:
          IOS_APP: ${{ secrets.IOS_BROWSERSTACK_APP_URL }}
        run: |
          case "$IOS_APP" in
            bs://*) [ "$(printf '%s' "$IOS_APP" | wc -l)" -eq 0 ] || { echo "::error::IOS_BROWSERSTACK_APP_URL must be a single line (only the bs:// id)"; exit 1; } ;;
            *) echo "::error::IOS_BROWSERSTACK_APP_URL is missing or is not a bs:// id. Upload the IPA with ios_app_groups_support=true and store its bs:// id in that secret."; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the PR's diff against the base branch is needed to pick the tests

      - name: Select the tests this pull request affects
        id: select
        if: github.event_name == 'pull_request'
        run: |
          selected="$(bash scripts/select-tests.sh '${{ github.base_ref }}' '${{ matrix.platform }}' testng-pr.xml)"
          {
            echo "### Tests selected for ${{ matrix.platform }}"
            if [ -n "$selected" ]; then echo '```'; echo "$selected"; echo '```'; else echo "None: this change touches no page, locator or test."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "has_tests=$([ -n "$selected" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create testData.json from secrets
        # Key names MUST match src/test/resources/testData.json.example. A mismatch surfaces as
        # "testData.json is missing key ..." from JsonDataReader at test start.
        run: |
          mkdir -p src/test/resources
          cat > src/test/resources/testData.json << 'EOF'
          {
            "credentials": {
              "reseller_user_creds": {
                "username": "${{ secrets.RESELLER_USERNAME }}",
                "password": "${{ secrets.RESELLER_PASSWORD }}",
                "bridge-account-name": "Gdynia-End-User-QA",
                "customer_Id_Above_120_Characters": "Lorem Ipsum is simply dummy text...",
                "test_account_email": "automation-test@brivo.com",
                "invalidEmailFormatText": "inavalidemailformattext",
                "existingUserInSystemButNotExistingInCurrentLogin": "${{ secrets.EXISTING_USER_EMAIL || 'seetham.c+reseller@brivo.com' }}",
                "attachId": "${{ secrets.ATTACH_ID }}"
              },
              "enduser_user_creds": {
                "username": "${{ secrets.ENDUSER_USERNAME }}",
                "password": "${{ secrets.ENDUSER_PASSWORD }}"
              },
              "ts02_user_creds": {
                "username": "${{ secrets.TS02_USERNAME }}",
                "password": "${{ secrets.TS02_PASSWORD }}"
              },
              "reseller3_user_creds": {
                "username": "${{ secrets.RESELLER3_USERNAME }}",
                "password": "${{ secrets.RESELLER3_PASSWORD }}"
              }
            },
            "search_filter": {
              "valid_search_term": "Camera",
              "invalid_search_term": "XYZ_NO_MATCH_12345",
              "bridge_valid_search_term": "Camera"
            },
            "timezone_data": {
              "valid_timezone": "Asia/Kolkata",
              "test_timezone": "Etc/GMT+12",
              "search_term": "Etc",
              "invalid_search_term": "XYZ_INVALID_TIMEZONE_12345"
            },
            "layout_data": {
              "layout_name": "AutoTest_Layout",
              "aspect_ratio": "16:9",
              "max_cameras_per_row": 2,
              "show_camera_title_bars": true
            },
            "mechanical_zoom_camera_data": {
              "camera_name": "${{ secrets.MECHANICAL_ZOOM_CAMERA_NAME || 'EN-CDUB-011a' }}"
            },
            "switchable_camera_data": {
              "camera_name": "${{ secrets.SWITCHABLE_CAMERA_NAME || 'Dm08' }}"
            },
            "archive_search_data": {
              "valid_search_term": "test",
              "no_results_search_term": "xyznonexistent12345",
              "cancel_folder_search_term": "2026-07-16 07-23-09.177 AM preview",
              "cancel_file_search_term": "2026-07-16 07-23-08.mp4"
            }
          }
          EOF

      - name: Create config.properties from secrets
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/config.properties << 'EOF'
          platform=android
          executionProvider=browserstack
          appiumServerUrl=http://127.0.0.1:4723
          browserstackHubUrl=https://hub-cloud.browserstack.com/wd/hub
          browserstackUserName=${{ secrets.BROWSERSTACK_USERNAME }}
          browserstackAccessKey=${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          browserstackProjectName=EEN Mobile Automation
          browserstackBuildName=${{ github.event_name == 'schedule' && 'Daily Regression' || 'CI Build' }} ${{ github.run_number }}${{ matrix.platform == 'ios' && ' (iOS)' || '' }}
          browserstackIdleTimeout=120
          # Debug logs, network logs and video are always on for a merge to main (the form input only exists on a manual
          # run). A manual run keeps them on by default and can turn them off. iOS network logs stay off, see below.
          browserstackDebug=${{ (github.event_name != 'workflow_dispatch' || inputs.diagnostics) && 'true' || 'false' }}
          browserstackNetworkLogs=${{ (github.event_name != 'workflow_dispatch' || inputs.diagnostics) && 'true' || 'false' }}
          browserstackVideo=${{ (github.event_name != 'workflow_dispatch' || inputs.diagnostics) && 'true' || 'false' }}
          EOF

      - name: Create android.properties for BrowserStack
        if: matrix.platform != 'ios'
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/android.properties << 'EOF'
          appPackage=com.een.vms.android
          # appActivity and appWaitActivity commented - Android 15 on BrowserStack won't launch with these set
          # appActivity=com.een.core.MainActivity
          # appWaitActivity=com.een.core.MainActivity
          automationName=UiAutomator2
          platformName=ANDROID
          platformVersion=15.0
          deviceName=Google Pixel 9
          app=${{ secrets.BROWSERSTACK_APP_URL }}
          newCommandTimeout=3600
          noReset=true
          fullReset=false
          dontStopAppOnReset=false
          connectHardwareKeyboard=true
          autoGrantPermissions=true
          EOF

      - name: Create ios.properties for BrowserStack
        # The IPA is not in the repo: IOS_BROWSERSTACK_APP_URL is the bs:// id of an IPA that was uploaded with
        # -F "ios_app_groups_support=true" (without it sign-in hangs on a spinner). Network logs stay off:
        # with them on the camera video never loads.
        if: matrix.platform == 'ios'
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/ios.properties << 'EOF'
          automationName=XCUITest
          deviceName=iPhone 15
          platformVersion=27
          browserstackApp=${{ secrets.IOS_BROWSERSTACK_APP_URL }}
          bundleId=com.eagleeyenetworks.eagleeye
          noReset=false
          fullReset=false
          newCommandTimeout=120
          browserstackNetworkLogs=false
          EOF

      - name: Compile and package
        run: mvn -B -DskipTests package

      - name: Run tests
        # A failure turns the run red so the author sees it; the check is not required, so it does not block the merge.
        # A pull request with no affected tests skips this step.
        if: github.event_name != 'pull_request' || steps.select.outputs.has_tests == 'true'
        env:
          # Read by the BrowserStack SDK when use_sdk is set; ignored otherwise.
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_URL: ${{ matrix.platform == 'ios' && secrets.IOS_BROWSERSTACK_APP_URL || secrets.BROWSERSTACK_APP_URL }}
          BROWSERSTACK_BUILD_NUMBER: ${{ github.run_number }}
        run: mvn test -Dplatform=${{ matrix.platform }} -DexecutionProvider=browserstack -Dsuite.file=${{ inputs.suite_file || (github.event_name == 'pull_request' && 'testng-pr.xml' || (matrix.platform == 'ios' && 'testng-ios.xml' || 'testng-parallel.xml')) }} -DsessionScope=${{ inputs.session_scope || 'class' }} ${{ inputs.use_sdk && '-DbrowserstackSdk=true' || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.platform }}
          path: |
            target/surefire-reports/
            target/page-sources/
            test-output/
          if-no-files-found: warn

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-build-${{ matrix.platform }}
          path: target/
          if-no-files-found: warn
