name: CI

on:
  push:
    branches: [main, master]  # Runs only when code is merged to main/master
  workflow_dispatch:  # Allows manual trigger from GitHub UI
    inputs:
      suite_file:
        description: 'TestNG suite to run (testng-parallel.xml = 2 parallel workers, then BridgesTest alone; testng.xml = everything serially; testng-diagnostics.xml to dump UI hierarchies)'
        type: string
        default: 'testng-parallel.xml'
      use_sdk:
        description: 'Run through the BrowserStack SDK (browserstack.yml) instead of direct capabilities'
        type: boolean
        default: false
      session_scope:
        description: 'class = one Appium session and login per test class (faster); method = fresh session and login per test'
        type: choice
        options: [class, method]
        default: class
      diagnostics:
        description: 'Turn BrowserStack debug logs, network logs and video back on (slower sessions)'
        type: boolean
        default: true

# The suite uses 2 BrowserStack sessions and shared test accounts/bridges, so two CI runs must never overlap.
# A later push waits for the running one instead of cancelling it half-way through its tests.
concurrency:
  group: browserstack-device-tests
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create testData.json from secrets
        # Key names MUST match src/test/resources/testData.json.example. A mismatch surfaces as
        # "testData.json is missing key ..." from JsonDataReader at test start.
        run: |
          mkdir -p src/test/resources
          cat > src/test/resources/testData.json << 'EOF'
          {
            "credentials": {
              "reseller_user_creds": {
                "username": "${{ secrets.RESELLER_USERNAME }}",
                "password": "${{ secrets.RESELLER_PASSWORD }}",
                "bridge-account-name": "Gdynia-End-User-QA",
                "customer_Id_Above_120_Characters": "Lorem Ipsum is simply dummy text...",
                "test_account_email": "automation-test@brivo.com",
                "invalidEmailFormatText": "inavalidemailformattext",
                "existingUserInSystemButNotExistingInCurrentLogin": "${{ secrets.EXISTING_USER_EMAIL || 'seetham.c+reseller@brivo.com' }}",
                "attachId": "${{ secrets.ATTACH_ID }}"
              },
              "enduser_user_creds": {
                "username": "${{ secrets.ENDUSER_USERNAME }}",
                "password": "${{ secrets.ENDUSER_PASSWORD }}"
              },
              "ts02_user_creds": {
                "username": "${{ secrets.TS02_USERNAME }}",
                "password": "${{ secrets.TS02_PASSWORD }}"
              }
            },
            "search_filter": {
              "valid_search_term": "Camera",
              "invalid_search_term": "XYZ_NO_MATCH_12345",
              "bridge_valid_search_term": "Camera"
            },
            "timezone_data": {
              "valid_timezone": "Asia/Kolkata",
              "test_timezone": "Etc/GMT+12",
              "search_term": "Etc",
              "invalid_search_term": "XYZ_INVALID_TIMEZONE_12345"
            },
            "layout_data": {
              "layout_name": "AutoTest_Layout",
              "aspect_ratio": "16:9",
              "max_cameras_per_row": 2,
              "show_camera_title_bars": true
            },
            "mechanical_zoom_camera_data": {
              "camera_name": "${{ secrets.MECHANICAL_ZOOM_CAMERA_NAME || 'EN-CDUB-011a' }}"
            },
            "archive_search_data": {
              "valid_search_term": "test",
              "no_results_search_term": "xyznonexistent12345"
            }
          }
          EOF

      - name: Create config.properties from secrets
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/config.properties << 'EOF'
          platform=android
          executionProvider=browserstack
          appiumServerUrl=http://127.0.0.1:4723
          browserstackHubUrl=https://hub-cloud.browserstack.com/wd/hub
          browserstackUserName=${{ secrets.BROWSERSTACK_USERNAME }}
          browserstackAccessKey=${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          browserstackProjectName=EEN Mobile Automation
          browserstackBuildName=CI Build ${{ github.run_number }}
          browserstackIdleTimeout=120
          browserstackDebug=${{ inputs.diagnostics == true && 'true' || 'false' }}
          browserstackNetworkLogs=${{ inputs.diagnostics == true && 'true' || 'false' }}
          browserstackVideo=${{ inputs.diagnostics == true && 'true' || 'false' }}
          EOF

      - name: Create android.properties for BrowserStack
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/android.properties << 'EOF'
          appPackage=com.een.vms.android
          # appActivity and appWaitActivity commented - Android 15 on BrowserStack won't launch with these set
          # appActivity=com.een.core.MainActivity
          # appWaitActivity=com.een.core.MainActivity
          automationName=UiAutomator2
          platformName=ANDROID
          platformVersion=15.0
          deviceName=Google Pixel 9
          app=${{ secrets.BROWSERSTACK_APP_URL }}
          newCommandTimeout=3600
          noReset=true
          fullReset=false
          dontStopAppOnReset=false
          connectHardwareKeyboard=true
          autoGrantPermissions=true
          EOF

      - name: Compile and package
        run: mvn -B -DskipTests package

      - name: Run tests
        # Note: continue-on-error removed intentionally to ensure CI fails on test failures
        # This prevents merging broken code and ensures all tests pass before merge
        env:
          # Read by the BrowserStack SDK when use_sdk is set; ignored otherwise.
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_URL: ${{ secrets.BROWSERSTACK_APP_URL }}
          BROWSERSTACK_BUILD_NUMBER: ${{ github.run_number }}
        run: mvn test -Dplatform=android -DexecutionProvider=browserstack -Dsuite.file=${{ inputs.suite_file || 'testng-parallel.xml' }} -DsessionScope=${{ inputs.session_scope || 'class' }} ${{ inputs.use_sdk && '-DbrowserstackSdk=true' || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/page-sources/
            test-output/
          if-no-files-found: warn

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-build
          path: target/
          if-no-files-found: warn
